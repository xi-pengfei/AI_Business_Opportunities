name: ai-business-opportunities
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://scout:${POSTGRES_PASSWORD:?Run scripts/setup.sh first}@db:5432/scout
    REDIS_URL: redis://redis:6379/0
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run scripts/setup.sh first}
    volumes:
      - ./infrastructure/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports: ["127.0.0.1:58080:8080"]
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
      POSTGRES_DB: scout
    ports: ["127.0.0.1:55436:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56386:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scout:${POSTGRES_PASSWORD}@db:5432/scout
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    ports: ["127.0.0.1:58100:8000"]
  worker:
    <<: *backend
    command: ["celery", "-A", "scout.worker:app", "worker", "-Q", "collection", "--concurrency=2", "--loglevel=WARNING"]
  dispatcher:
    <<: *backend
    command: ["python", "-m", "scout.dispatcher"]
  web:
    build: ./frontend
    ports: ["127.0.0.1:5180:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
