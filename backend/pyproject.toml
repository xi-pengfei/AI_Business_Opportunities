[project]
name = "ai-business-opportunities"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "dingtalk-stream>=0.24,<1",
  "python-socks[asyncio]>=2.7,<3",
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.9,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
